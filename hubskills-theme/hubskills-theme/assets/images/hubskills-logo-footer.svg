  <title id="title">HubSkills</title>
  <desc id="desc">Logo vetorial da plataforma HubSkills para rodapé escuro</desc>
  <defs>
    <linearGradient id="mark" x1="18" y1="15" x2="80" y2="72" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#58A6FF"/>
